name: marlin_auto_build

on:
  push:
    paths:
      - 'builds/**'
      - '.github/workflows/**'
  schedule:
    - cron:  '30 3 * * *'
  workflow_dispatch:

# The action creates GitHub releases and pushes the updated build trackers /
# autogenerated configs back to the repository. New repositories default to a
# read-only GITHUB_TOKEN, which makes both of those fail with HTTP 403.
permissions:
  contents: write

jobs:
  create_builds:
    runs-on: ubuntu-latest 
    steps:
    - uses: CarlosPadilla/marlin_auto_build@master
